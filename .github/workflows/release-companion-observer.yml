name: Release companion observer firmware

# Builds the three ready-made companion observer targets and attaches the
# merged images to a GitHub Release.
#
# Merged images (bootloader + partition table + app in one file at offset 0x0)
# are what the MeshCore web flasher wants when you pick "custom firmware", so
# they are the only asset published here.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get downloadable artifacts without
# creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: Tbeam_SX1262_companion_radio_wifi_mqtt
            asset: tbeam-sx1262
          - env: Heltec_v3_companion_radio_wifi_mqtt
            asset: heltec-v3
          - env: LilyGo_T3S3_companion_radio_wifi_mqtt
            asset: lilygo-t3s3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build merged image
        run: pio run -t mergebin -e ${{ matrix.env }}

      - name: Name the asset
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" \
             "dist/companion-observer-${{ matrix.asset }}-${{ github.ref_name }}-merged.bin"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.asset }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
          body: |
            Merged firmware images for the companion observer.

            Flash with the [MeshCore web flasher](https://flasher.meshcore.co.uk/)
            — connect the board, choose **custom firmware**, and upload the file
            for your board. These are full images written at offset `0x0`, so
            they include the bootloader and partition table.

            | Board | File |
            |---|---|
            | LilyGO T-Beam SX1262 | `…-tbeam-sx1262-…-merged.bin` |
            | Heltec WiFi LoRa 32 V3 | `…-heltec-v3-…-merged.bin` |
            | LilyGO T3-S3 | `…-lilygo-t3s3-…-merged.bin` |

            **The T3-S3 image changes the partition table** (`min_spiffs`, which
            the stock T3-S3 companion builds do not use), so its first flash
            resets stored settings — including the node identity. The T-Beam and
            Heltec V3 images keep the layout their stock builds already use.

            After flashing, configure the node over the USB console at 115200
            baud — see
            [OBSERVER.md](https://github.com/BadCactus634/meshcore-companion-observer/blob/companion-observer/OBSERVER.md#configuration).
            Nothing is baked into these binaries: no WiFi credentials, no broker.
