name: Release companion observer firmware

# Builds the three ready-made companion observer targets and attaches the
# merged images to a GitHub Release.
#
# Merged images (bootloader + partition table + app in one file at offset 0x0)
# are what the MeshCore web flasher wants when you pick "custom firmware", so
# they are the only asset published here.
#
# Push a tag to cut a release:   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab to get downloadable artifacts without
# creating a release.
#
# EVERY RELEASE, update two version-specific strings in the release body below:
#   1. the MeshCore base version this build tracks ("based on MeshCore vX.Y.Z");
#   2. the "Release notes:" URL — copy the link from the matching upstream
#      release at github.com/meshcore-dev/MeshCore/releases (companion-vX.Y.Z).
#      It is a new blog.meshcore.io URL for every release.
# Also re-check the "Does this erase the node's memory?" section: it must state
# what the upgrade actually does to stored config for that particular version.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: Tbeam_SX1262_companion_radio_wifi_mqtt
            asset: tbeam-sx1262
          - env: Heltec_v3_companion_radio_wifi_mqtt
            asset: heltec-v3
          - env: LilyGo_T3S3_companion_radio_wifi_mqtt
            asset: lilygo-t3s3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ matrix.env }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build merged image
        run: pio run -t mergebin -e ${{ matrix.env }}

      - name: Name the asset
        run: |
          mkdir -p dist
          cp ".pio/build/${{ matrix.env }}/firmware-merged.bin" \
             "dist/companion-observer-${{ matrix.asset }}-${{ github.ref_name }}-merged.bin"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.asset }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          # No auto-generated commit changelog: the upstream release notes linked
          # in the body are what users actually want to read.
          generate_release_notes: false
          body: |
            Merged firmware images for the companion observer, based on MeshCore
            **v1.17.0**.

            Release notes: https://blog.meshcore.io/2026/08/09/release-1-17-0

            ## Does this erase the node's memory?

            **No.** Flashing this firmware keeps the node's stored configuration —
            identity, contacts, channels, radio settings and the observer's own
            MQTT/WiFi settings all survive the update.

            MeshCore 1.17 changes how preferences are stored (a JSON `prefs.json`
            replaces the old fixed binary layout). The firmware converts the
            existing file automatically on first boot and leaves the old one in
            place, so nothing is lost and you can roll back.

            The one exception is the **T3-S3**, and only when you come from a
            *stock* T3-S3 companion build: the observer image needs a larger app
            partition (`min_spiffs`) than the stock T3-S3 builds use, and changing
            the partition table resets storage, including the node identity.
            Upgrading from an earlier companion observer release uses the same
            table, so nothing is erased. The T-Beam and Heltec V3 images keep the
            layout their stock builds already use.

            ## Flashing

            Flash with the [MeshCore web flasher](https://flasher.meshcore.co.uk/)
            — connect the board, choose **custom firmware**, and upload the file
            for your board. These are full images written at offset `0x0`, so
            they include the bootloader and partition table.

            | Board | File |
            |---|---|
            | LilyGO T-Beam SX1262 | `…-tbeam-sx1262-…-merged.bin` |
            | Heltec WiFi LoRa 32 V3 | `…-heltec-v3-…-merged.bin` |
            | LilyGO T3-S3 | `…-lilygo-t3s3-…-merged.bin` |

            After flashing, configure the node over the USB console at 115200
            baud — see
            [OBSERVER.md](https://github.com/BadCactus634/meshcore-companion-observer/blob/companion-observer/OBSERVER.md#configuration).
            Nothing is baked into these binaries: no WiFi credentials, no broker.
